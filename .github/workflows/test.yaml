name: test-on-dev

on: 
  push:
    branches:
      - 'dev'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses:  actions/checkout@v4
      - name: setup Python
        uses:  actions/setup-python@v5
      - name: cd into backend
        run:  cd backend
      - name: test
        run:  ./run_test.sh 
